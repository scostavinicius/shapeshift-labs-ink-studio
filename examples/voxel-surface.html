<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Solid Signals — Voxel & Relief Pixels</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #07131d;
      color: #c6ddcd;
      font: 14px system-ui;
      margin: 0;
    }
    main {
      max-width: 1280px;
      margin: auto;
      padding: 30px;
    }
    header {
      font: 10px monospace;
      letter-spacing: 3px;
      color: #77a59c;
      border-bottom: 1px solid #28434b;
      padding-bottom: 18px;
    }
    h1 {
      font: 44px Georgia;
      margin: 25px 0 8px;
      color: #f1cc8a;
    }
    p {
      color: #88aba8;
      font-size: 13px;
      line-height: 1.7;
    }
    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 12px;
    }
    button {
      background: #102b35;
      border: 1px solid #355a60;
      color: #c9e4cf;
      padding: 10px 16px;
      cursor: pointer;
      font: 11px monospace;
    }
    button.active {
      border-color: #d1a767;
      color: #ffd99a;
    }
    canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      touch-action: none;
      background: #071b27;
      border: 1px solid #28434b;
    }
    footer {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: space-between;
      color: #69928f;
      font: 11px monospace;
      margin-top: 15px;
    }
    .hint {
      margin-left: auto;
      align-self: center;
      color: #77a59c;
      font: 10px monospace;
    }
  </style>
  <main>
    <header>INK STUDIO</header>
    <h1>Solid Signals</h1>
    <p>Orbit the canal, break its tower, or watch a sculpted figure separate into blocks.</p>
    <nav>
      <button data-view="city" class="active">Canal district</button><button data-view="automaton">Automaton</button
      ><button data-view="study">Four readings</button><span class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</span>
    </nav>
    <canvas id="view" aria-label="Interactive voxel scene" width="1200" height="720"></canvas>
    <nav>
      <button id="break">Break tower</button><button id="scatter">Scatter / reassemble</button
      ><button id="reset">Reset</button><button id="pause">Pause</button><span id="caption" class="hint"></span>
    </nav>
    <footer><span id="status">Sampling signed fields…</span><span>CUBES / COLUMNS / SLABS / RELIEF</span></footer>
  </main>
  <script src="../dist/ink-studio.browser.js"></script>
  <script src="./voxel-surface.js"></script>
  <script type="module">
    import { createRenderer } from '../webgl.mjs';
    const kit = {
      KIT,
      makeBuilder,
      makeSculpt,
      PixelLook,
      SpriteSurface,
      TexturedSurface,
      RenderStages,
      TargetSelectors,
      SplatProvenance
    };
    const canvas = document.getElementById('view'),
      renderer = createRenderer(canvas, { toolkit: kit }),
      demo = voxelSurfaceDemo(kit);
    demo.state.view = 'city';
    window.voxelQA = { demo, renderer };
    function refresh() {
      document
        .querySelectorAll('[data-view]')
        .forEach(b => b.classList.toggle('active', b.dataset.view === demo.state.view));
      document.getElementById('break').disabled = demo.state.view !== 'city';
      document.getElementById('scatter').disabled = demo.state.view !== 'automaton';
      document.getElementById('caption').textContent = {
        city: 'A CLOSED-BLOCK TOWER / SHARED RIGID-BODY PHYSICS',
        automaton: 'SCULPT TO BLOCKS / SCATTER AND REASSEMBLE',
        study: 'FRONT: CUBES, COLUMNS / BACK: SLABS, RELIEF'
      }[demo.state.view];
    }
    document.querySelectorAll('[data-view]').forEach(
      b =>
        (b.onclick = () => {
          demo.state.view = b.dataset.view;
          refresh();
        })
    );
    document.getElementById('break').onclick = () => demo.break();
    document.getElementById('scatter').onclick = () => {
      demo.state.spread = demo.state.spread ? 0 : 1;
    };
    document.getElementById('reset').onclick = () => demo.reset();
    document.getElementById('pause').onclick = e => {
      demo.state.paused = !demo.state.paused;
      e.target.textContent = demo.state.paused ? 'Resume' : 'Pause';
    };
    refresh();
    let drag,
      last,
      stamp,
      frames = 0,
      fps = 60;
    canvas.onpointerdown = e => {
      drag = [e.clientX, e.clientY, demo.camera.yaw, demo.camera.pitch];
      canvas.setPointerCapture(e.pointerId);
    };
    canvas.onpointermove = e => {
      if (drag) {
        demo.camera.yaw = drag[2] - (e.clientX - drag[0]) * 0.005;
        demo.camera.pitch = Math.max(-0.6, Math.min(1.4, drag[3] + (e.clientY - drag[1]) * 0.005));
      }
    };
    canvas.onpointerup = canvas.onpointercancel = () => (drag = null);
    canvas.addEventListener(
      'wheel',
      e => {
        e.preventDefault();
        demo.camera.dist = Math.max(3, Math.min(24, demo.camera.dist * Math.exp(e.deltaY * 0.001)));
      },
      { passive: false }
    );
    function tick(t) {
      const dt = last === undefined ? 0 : Math.min(0.04, (t - last) / 1000);
      last = t;
      demo.step(dt);
      renderer.render(demo.world, {
        time: demo.state.time,
        camera: demo.camera,
        changedRows: demo.rows(),
        width: 1200,
        height: 720,
        damp: false,
        stepAnimation: false,
        raw: true
      });
      stamp ??= t;
      frames++;
      if (t - stamp > 800) {
        fps = Math.round((frames * 1000) / (t - stamp));
        frames = 0;
        stamp = t;
      }
      document.getElementById('status').textContent =
        demo.world.count.toLocaleString() + ' native splats / ' + fps + ' fps';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</html>
