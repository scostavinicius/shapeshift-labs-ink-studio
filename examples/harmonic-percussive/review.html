<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay break · Ink Studio</title>
<style>
 :root{color-scheme:dark;--bg:#191e27;--panel:#222a37;--line:#435267;--ink:#f0e8d9;--dim:#b5c0d1;--tone:#a9dccc;--hit:#ffbc86}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
 main{max-width:980px;margin:auto;padding:clamp(24px,6vw,65px) clamp(16px,4vw,36px)}
 h1,h2{font-family:Georgia,serif;font-weight:400}
 h1{font-size:clamp(52px,9vw,90px);line-height:1;letter-spacing:-.055em;margin:0 0 12px}
 h2{font-size:1.54rem;margin:0 0 10px}
 p{color:var(--dim);margin:0}
 section{border:1px solid var(--line);border-radius:12px;padding:clamp(15px,4vw,23px);background:var(--panel);margin-top:18px}
 .choices,.actions{display:flex;flex-wrap:wrap;gap:8px}
 button{background:#1a2431;color:var(--ink);padding:8px 12px;font:inherit;border:1px solid var(--line);border-radius:6px;cursor:pointer}
 button[aria-pressed="true"],#apply{background:var(--tone);border-color:var(--tone);color:#172921;font-weight:650}
 button:disabled{cursor:default;opacity:.57}
 button:focus-visible,input:focus-visible{outline:2px solid var(--hit);outline-offset:3px}
 audio{display:block;width:100%;margin:12px 0}
 .track{display:grid;grid-template-columns:6.2rem minmax(0,1fr);align-items:center;gap:10px;font-size:.9rem;margin-bottom:7px}
 canvas{width:100%;height:42px;display:block;background:#182231;border-radius:4px}
 .tonal{color:var(--tone)}.hits{color:var(--hit)}
 .edit-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(208px,1fr));gap:12px 20px;margin-bottom:16px}
 .edit-controls label{display:grid;grid-template-columns:1fr max-content;gap:1px 8px}
 .edit-controls output{color:var(--dim);font-variant-numeric:tabular-nums}
 .edit-controls input{grid-column:1 / -1;width:100%;accent-color:var(--hit);margin:5px 0 0}
 .edit-controls .tonal input{accent-color:var(--tone)}
 #status{min-height:1.5em;margin-top:8px}
 @media(max-width:460px){.track{grid-template-columns:4.5rem minmax(0,1fr)}}
</style>
<main>
 <header>
  <h1>Relay break</h1>
  <p>Separate the ringing notes and drum attacks in a stereo break. Solo either layer or hear them back together.</p>
 </header>
 <section aria-labelledby="listen-title">
  <h2 id="listen-title">Listen</h2>
  <div class="choices" role="group" aria-label="Audition">
   <button type="button" data-mode="original" aria-pressed="true">Original</button>
   <button type="button" data-mode="harmonic" aria-pressed="false">Tonal layer</button>
   <button type="button" data-mode="percussive" aria-pressed="false">Drum layer</button>
   <button type="button" data-mode="recombined" aria-pressed="false">Recombined</button>
   <button type="button" data-mode="remix" aria-pressed="false">Remix</button>
  </div>
  <audio controls preload="metadata" aria-label="Relay break audition"></audio>
  <div class="track tonal">Tonal <canvas id="harmonic-wave" aria-label="Tonal layer waveform"></canvas></div>
  <div class="track hits">Drum hits <canvas id="percussive-wave" aria-label="Drum layer waveform and selected hits"></canvas></div>
 </section>
 <section aria-labelledby="edit-title">
  <h2 id="edit-title">Edit the remix</h2>
  <div class="edit-controls">
   <label class="tonal">Tonal pitch <output id="pitch-value"></output><input id="pitch" type="range" min="-12" max="12"></label>
   <label class="hits">First snare <output id="hit-a-value"></output><input id="hit-a" type="range" min="-140" max="180"></label>
   <label class="hits">Second snare <output id="hit-b-value"></output><input id="hit-b" type="range" min="-140" max="180"></label>
  </div>
  <div class="actions">
   <button type="button" id="apply">Audition edits</button>
   <button type="button" id="save">Save session JSON</button>
  </div>
  <p id="status" role="status">The remix starts with the tones pitched up and two snare hits moved.</p>
 </section>
</main>
<script>
const config=/*INK_SPLIT_DATA*/;
const compressedEngine=/*INK_SPLIT_ENGINE*/;
/*INK_SPLIT_SCRIPT*/
</script>
</html>
