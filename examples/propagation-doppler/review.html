<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milepost 72 · Ink Studio</title>
<style>
:root{color-scheme:dark;--bg:#111920;--panel:#1b2730;--edge:#374955;--text:#f9f1df;--muted:#b4c2c8;--amber:#f1b775;--blue:#a9d6df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,sans-serif;color:var(--text)}main{max-width:1000px;margin:auto;padding:39px 26px 28px}h1{margin:0;font:clamp(3rem,8vw,5.5rem)/.9 Georgia,serif;letter-spacing:-.065em}header{margin-bottom:19px}p{color:var(--muted);margin:10px 0}header p{max-width:68ch}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:13px}.yard{overflow:hidden}.yard svg{display:block;width:100%;height:auto}.controls{margin-top:12px;padding:15px 17px}.transport,.group,.jumps,.legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.transport output{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}button{font:inherit;background:#25323c;border:1px solid #465964;border-radius:7px;color:var(--text);padding:7px 11px;cursor:pointer}button:hover{border-color:var(--blue)}button[aria-pressed=true]{background:var(--blue);color:#18232a;border-color:var(--blue)}button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}#play{background:var(--amber);border-color:var(--amber);color:#28211a;font-weight:650;min-width:75px}.timeline{width:100%;margin:6px 0 2px;accent-color:var(--amber)}.plot{display:block;width:100%;height:116px;margin-top:10px}.jumps button{padding:5px 8px;font-size:.86rem}.legend{gap:12px;font-size:.82rem;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:50%}.data{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{padding:11px 14px}.metric span{display:block;font-size:.84rem;color:var(--muted)}.metric output{font:1.4rem Georgia,serif}.summary{font-size:.86rem;margin:12px 0}@media(max-width:620px){main{padding:25px 13px}.controls{padding:11px}.metric{padding:9px}.metric span{font-size:.75rem}.metric output{font-size:1.1rem}.group button{padding:5px 7px;font-size:.82rem}.transport{gap:5px}.transport output{font-size:.77rem}.yard text{font-size:18px}}
</style>
</head>
<body>
<main>
<header>
<h1>Milepost 72</h1>
<p>A train passes a fixed listener at 72 m/s. Watch the horn flash and hear it arrive later. Switch to Off or Exaggerated at the same point in the pass.</p>
</header>
<section class="panel yard" aria-label="Train and sound positions">
<svg viewBox="0 0 910 196" role="img" aria-labelledby="rail-title">
<title id="rail-title">Track showing the moving train, its apparent sound position, and a fixed listener</title>
<defs><pattern id="sleepers" width="24" height="48" patternUnits="userSpaceOnUse"><path d="M9 6V45" stroke="#52606a" stroke-width="2.5" opacity=".58"/></pattern></defs>
<rect x="34" y="58" width="842" height="47" fill="url(#sleepers)"/>
<path d="M34 68H876M34 94H876" stroke="#8ea2a8" stroke-width="2"/>
<path d="M453 92V153" stroke="#728992" stroke-dasharray="3 4"/>
<circle cx="453" cy="149" r="8" fill="#e9dece"/><path d="M444 160Q453 153 462 160" stroke="#e9dece" fill="none"/>
<text x="453" y="183" text-anchor="middle" fill="#e9dece" font-size="14">Listener</text>
<text x="37" y="34" fill="#b4c2c8" font-size="15">Approach</text><text x="873" y="34" text-anchor="end" fill="#b4c2c8" font-size="15">Departure</text>
<path id="ray" d="M42 81L453 149" stroke="#a9d6df" stroke-width="1.25" fill="none" stroke-dasharray="3 5"/>
<circle id="sound" cx="42" cy="81" r="9" fill="#1b2730" stroke="#a9d6df" stroke-width="2"/>
<g id="train"><rect x="-25" y="-12" width="48" height="24" rx="3" fill="#f1b775" stroke="#251c15" stroke-width="1.5"/>
<path d="M13-8 25-4 25 4 13 8Z" fill="#493126"/><path d="M-18-6v12m7-12v12" stroke="#493126" stroke-width="2"/>
<circle id="flash" cx="19" cy="-13" r="8" fill="#ffe6ac" opacity="0"/></g>
<g transform="translate(34 130)" font-size="13" fill="#b4c2c8">
<circle cx="5" cy="0" r="4" fill="#f1b775"/><text x="16" y="4">Train</text>
<circle cx="74" cy="0" r="4" fill="none" stroke="#a9d6df" stroke-width="1.5"/><text x="85" y="4">Heard position</text>
</g>
</svg>
</section>
<section class="panel controls" aria-label="Audio comparison and timeline">
<div class="transport">
<button type="button" id="play">Play</button>
<div class="group" role="group" aria-label="Propagation intensity">
<button type="button" data-mode="physical" aria-pressed="true">Physical</button>
<button type="button" data-mode="flat" aria-pressed="false">Off</button>
<button type="button" data-mode="pushed" aria-pressed="false">Exaggerated</button>
</div>
<output id="time" aria-label="Playback time">0.00 s</output>
</div>
<svg class="plot" viewBox="0 0 850 116" preserveAspectRatio="none" role="img" aria-labelledby="pitch-title">
<title id="pitch-title">Engine pitch with horn emission and arrival marked</title>
<path id="nominal" stroke="#586b76" stroke-dasharray="4 4" fill="none"/>
<path id="curve" stroke="#a9d6df" stroke-width="1.8" fill="none"/>
<path id="emit" stroke="#f1b775" stroke-width="1.8"/><path id="arrive" stroke="#eee2d0" stroke-width="1.8"/>
<path id="cursor" stroke="#82a8b0" stroke-width="1.5"/>
</svg>
<input type="range" id="timeline" class="timeline" min="0" max="10.24" step=".01" value="0" aria-label="Playback position">
<div class="legend"><span><i style="background:var(--blue)"></i>Motor pitch</span><span><i style="background:var(--amber)"></i>Horn emits</span><span><i style="background:#eee2d0"></i>Horn arrives</span></div>
<div class="jumps" style="margin-top:11px" role="group" aria-label="Jump to a part of the pass">
<button type="button" data-jump="horn">Horn flash</button><button type="button" data-jump="pass">Pass</button><button type="button" data-jump="depart">Recede</button>
</div>
</section>
<div class="data">
<div class="panel metric"><span>Motor pitch</span><output id="frequency"></output></div>
<div class="panel metric"><span>Current travel delay</span><output id="travel"></output></div>
<div class="panel metric"><span>Horn flight time</span><output id="flight"></output></div>
</div>
<p id="summary" class="summary"></p>
<audio id="audio" preload="auto" aria-label="Train flyby audition"></audio>
</main>
<script>
const demo=/*INK_TRAIN_DEMO*/;
const get=id=>document.getElementById(id), audio=get('audio'), timeline=get('timeline'), play=get('play');
const buttons=[...document.querySelectorAll('[data-mode]')], plot=t=>t/demo.duration*850;
const pitch=hz=>110-(hz-230)*100/(550-230), rail=x=>42+(x+368)/755*826;
let mode='physical', seekAfterLoad=null, resume=false, animation=0;
function marker(id,t){get(id).setAttribute('d',`M${plot(t)} 0V116`);}
function draw(){
  const d=demo.tracks[mode].map((row,i)=>(i?'L':'M')+plot(i*demo.dt).toFixed(2)+' '+pitch(row.frequency).toFixed(2)).join('');
  get('curve').setAttribute('d',d);
  get('nominal').setAttribute('d',`M0 ${pitch(demo.nominal)}H850`);
  marker('emit',demo.hornTime);marker('arrive',demo.details[mode].horn);
  get('flight').value=demo.details[mode].hornDelay.toFixed(2)+' s';
  const {effect}=demo.modes.find(row=>row.id===mode), delay=effect?effect.delayScale:0, doppler=effect?effect.dopplerScale:0;
  get('summary').textContent=`Delay ×${delay} · Doppler ×${doppler} · The horn is emitted at ${demo.hornTime.toFixed(2)} s and reaches the listener at ${demo.details[mode].horn.toFixed(2)} s.`;
}
function show(t){
  const rows=demo.tracks[mode], row=rows[Math.min(rows.length-1,Math.round(t/demo.dt))];
  get('train').setAttribute('transform',`translate(${rail(row.x)},81)`);
  get('flash').setAttribute('opacity',String(t>=demo.hornTime&&t<demo.hornTime+.17?.9:0));
  get('ray').setAttribute('d',`M${rail(row.heardX)} 81L453 149`);
  get('sound').setAttribute('cx',rail(row.heardX));
  for(const id of ['sound','ray'])get(id).setAttribute('opacity',row.remaining>0?.15:1);
  get('frequency').value=row.remaining>0?'Waiting':Math.round(row.frequency)+' Hz';
  get('travel').value=row.travel.toFixed(2)+' s';
  get('time').value=t.toFixed(2)+' s / '+demo.duration.toFixed(2)+' s';
  timeline.value=t;marker('cursor',t);
}
function follow(){show(audio.currentTime);if(!audio.paused)animation=requestAnimationFrame(follow);}
function seek(t){if(audio.readyState)audio.currentTime=t;else seekAfterLoad=t;show(t);}
function choose(next){
  if(audio.getAttribute('src')&&mode===next)return;
  seekAfterLoad=seekAfterLoad??audio.currentTime;
  resume=resume||!audio.paused;
  mode=next;
  buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
  audio.src=demo.recordings[mode];draw();show(seekAfterLoad);
}
audio.addEventListener('loadedmetadata',()=>{
  if(seekAfterLoad!==null){audio.currentTime=seekAfterLoad;seekAfterLoad=null;}
  if(resume){resume=false;audio.play().catch(()=>{});}
  show(audio.currentTime);
});
audio.addEventListener('play',()=>{play.textContent='Pause';cancelAnimationFrame(animation);follow();});
audio.addEventListener('pause',()=>{play.textContent='Play';cancelAnimationFrame(animation);show(seekAfterLoad??audio.currentTime);});
audio.addEventListener('ended',()=>{play.textContent='Replay';show(demo.duration);});
play.addEventListener('click',()=>{if(audio.paused)audio.play().catch(()=>{});else audio.pause();});
timeline.addEventListener('input',()=>seek(Number(timeline.value)));
buttons.forEach(button=>button.addEventListener('click',()=>choose(button.dataset.mode)));
const jumps={horn:demo.hornTime-.17,pass:demo.pass-.45,depart:demo.pass+1.1};
for(const button of document.querySelectorAll('[data-jump]'))button.addEventListener('click',()=>seek(jumps[button.dataset.jump]));
choose('physical');
</script>
</body>
</html>
