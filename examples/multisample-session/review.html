<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Room · Ink Studio</title>
<style>
  :root{color-scheme:light;--ink:#20283b;--muted:#566175;--paper:#f4f2ed;--line:#d2d4d9;--blue:#314cb2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
  main{max-width:1040px;margin:auto;padding:clamp(22px,5vw,58px) clamp(16px,5vw,56px)}
  .product{color:var(--blue);font:650 .73rem/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
  h1{font:normal clamp(3.8rem,8vw,7rem)/.95 Georgia,serif;letter-spacing:-.068em;margin:.08em 0 .12em}
  header p{max-width:66ch;margin:0 0 22px;color:var(--muted)}
  .desk{border:1px solid var(--line);background:#fffcf7;border-radius:14px;overflow:hidden}
  .transport,.perspective{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:16px clamp(14px,3vw,24px)}
  .transport{border-bottom:1px solid var(--line)}
  button{border:1px solid transparent;border-radius:7px;background:transparent;color:inherit;font:600 .87rem system-ui,sans-serif;padding:8px 11px;cursor:pointer}
  button:hover:not(:disabled){background:#ededf7}
  button[aria-pressed=true]{background:#e2e6ff;color:#273a84}
  button:disabled{opacity:.58;cursor:wait}
  #play{background:var(--blue);color:white;min-width:112px}
  #play:hover:not(:disabled){background:#233c98}
  :focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .compare{display:flex;padding:3px;gap:3px;border-radius:9px;border:1px solid var(--line)}
  #time{margin-left:auto;color:var(--muted);font:500 .82rem ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .slider{flex:1 0 220px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
  .slider input{grid-column:1/-1;width:100%;accent-color:var(--blue);margin:4px 0;cursor:pointer}
  .slider button{justify-self:start;font-size:.76rem;padding:4px 2px;color:var(--muted)}
  .slider button:nth-last-child(2){justify-self:center}
  .slider button:last-child{justify-self:end}
  .perspective label{min-width:100px;font-weight:620;font-size:.9rem}
  #room-value{font:600 .8rem ui-monospace,monospace;color:var(--blue)}
  .graphs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
  figure{margin:0;padding:14px 16px 9px;border:1px solid var(--line);border-radius:12px;background:#fffcf7}
  figure.active{border-color:#8292d9}
  figcaption{font-weight:630;font-size:.9rem;margin-bottom:7px}
  canvas{display:block;width:100%;height:145px}
  .calibration{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 0}
  .calibration div{border-top:1px solid var(--line);padding-top:8px}
  dt{font-weight:650;font-size:.82rem}
  dd{margin:2px 0 0;color:var(--muted);font:.75rem/1.45 ui-monospace,monospace}
  #status{min-height:1.4em;color:var(--muted);font-size:.84rem;margin:12px 0 0}
  @media(max-width:630px){.graphs{grid-template-columns:1fr}.transport #time{margin-left:0}.slider{min-width:100%}.calibration{gap:6px}dd{font-size:.68rem}}
</style>
<main>
  <header>
    <div class="product">Ink Studio / Multisample alignment</div>
    <h1>Glass Room</h1>
    <p>Three simulated microphones on a struck-glass instrument. Play the phrase, switch between raw and calibrated clocks, then move the microphone perspective while it plays.</p>
  </header>
  <section class="desk" aria-label="Microphone audition">
    <div class="transport">
      <button id="play" type="button" disabled>Play phrase</button>
      <div class="compare" role="group" aria-label="Clock alignment">
        <button id="raw" type="button" aria-pressed="false">Raw clocks</button>
        <button id="aligned" type="button" aria-pressed="true">Calibrated</button>
      </div>
      <output id="time" aria-label="Elapsed playback time">0.00 s</output>
    </div>
    <div class="perspective">
      <label for="room">Perspective</label>
      <div class="slider">
        <input id="room" type="range" min="0" max="100" value="70" step="1">
        <button type="button" data-position="0">Close</button>
        <button type="button" data-position="50">Middle</button>
        <button type="button" data-position="100">Room</button>
      </div>
      <output id="room-value" for="room">70%</output>
    </div>
  </section>
  <section class="graphs" aria-label="First strike by microphone, on the close mic clock">
    <figure id="raw-figure">
      <figcaption>First strike · raw clocks</figcaption>
      <canvas id="raw-trace" role="img" aria-label="Three microphone waveforms showing recorder skew"></canvas>
    </figure>
    <figure class="active" id="aligned-figure">
      <figcaption>First strike · calibrated</figcaption>
      <canvas id="aligned-trace" role="img" aria-label="Three calibrated waveforms with acoustic arrival times retained"></canvas>
    </figure>
  </section>
  <dl class="calibration" id="measurements"></dl>
  <p id="status" role="status">Preparing the phrase…</p>
</main>
<script>
const demo=/*INK_MIC_DATA*/;
/*INK_MIC_SCRIPT*/
</script>
</html>
