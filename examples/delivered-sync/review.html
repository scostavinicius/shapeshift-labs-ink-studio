<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay Press · Delivered sync check</title>
<style>
  :root{color-scheme:dark;--bg:#131823;--panel:#1c2430;--edge:#354355;--text:#eae8de;--muted:#aeb9c6;
    --picture:#9edbd0;--audio:#efad83;--schedule:#b3b7c8;--accent:#ffce8d}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 50% -30%,#314550 0%,var(--bg) 67%);color:var(--text);
    font:15px/1.45 system-ui,sans-serif}
  main{max-width:1120px;margin:auto;padding:27px 28px 34px}
  header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:14px}
  h1{font:500 clamp(39px,6vw,56px)/.98 Georgia,serif;letter-spacing:-.04em;margin:5px 0 7px}
  h2{font:650 14px/1.3 system-ui,sans-serif;margin:0}
  p{margin:0;color:var(--muted)}
  .overline,time,.number{font:600 11px/1.4 ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .overline{color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
  .modes{display:flex;padding:3px;border:1px solid var(--edge);border-radius:9px;background:#151d27;gap:4px;flex-shrink:0}
  button{font:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer}
  button:hover{background:#2e3946}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .modes button{padding:7px 12px;font-size:13px}
  .modes [aria-pressed=true]{background:#ead7b5;color:#26262c}
  .workspace{display:grid;grid-template-columns:1.9fr 1fr;gap:12px}
  .viewer,.inspect,.clock{border:1px solid var(--edge);border-radius:10px;background:var(--panel);overflow:hidden}
  .stage{position:relative;background:#151b25;aspect-ratio:720/408}
  video{position:absolute;width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
  .transport{padding:8px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--edge)}
  .transport button{min-width:56px;border-color:var(--edge);padding:3px 6px;font-size:13px}
  .transport input{width:100%;min-width:0;accent-color:var(--accent)}
  .transport output{white-space:nowrap;font-size:11px;color:var(--muted)}
  .inspect{padding:14px;display:flex;flex-direction:column;gap:12px}
  .status{border-bottom:1px solid var(--edge);padding:0 0 10px}
  .status output{font:500 clamp(31px,5vw,46px)/1.06 Georgia,serif;display:block;margin-top:5px;color:var(--audio)}
  .status.good output{color:var(--picture)}
  .status p{font-size:13px;margin-top:5px}
  .evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  figure{margin:0}
  figure img{width:100%;object-fit:contain;image-rendering:pixelated;background:#131b27;border:1px solid var(--edge);border-radius:5px}
  figcaption{font-size:12px;color:var(--muted);margin-top:2px}
  figcaption b{color:var(--text)}
  .jumps{display:flex;gap:7px;flex-wrap:wrap}
  .jumps button{font-size:12px;border-color:var(--edge);padding:4px 8px}
  .clock{margin-top:12px;padding:12px 14px}
  .clock header{margin:0 0 8px}
  .axis,.lane{display:grid;grid-template-columns:136px 1fr 80px;align-items:center;gap:8px}
  .axis{margin-bottom:2px;font-size:10px;color:var(--muted)}
  .axis span:nth-child(2){display:flex;justify-content:space-between}
  .lane{height:26px}
  .lane label{font-size:12px}
  .rail{height:1px;background:#586375;position:relative}
  .rail:after{content:"";position:absolute;left:var(--at,0%);top:-5px;width:10px;height:10px;border:1px solid rgba(0,0,0,.22);
    background:var(--mark);border-radius:2px;transform:translateX(-50%) rotate(45deg)}
  .lane time{justify-self:end}
  .picture{--mark:var(--picture)}.audio{--mark:var(--audio)}.scheduled{--mark:var(--schedule)}
  @media(max-width:800px){.workspace{grid-template-columns:1fr}.inspect{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
    .status{border-bottom:0}.inspect h2{display:none}.jumps{grid-column:1/-1}.clock{margin-top:10px}}
  @media(max-width:470px){main{padding:14px 12px}header{align-items:start;flex-direction:column;gap:8px}
    .axis,.lane{grid-template-columns:101px 1fr 63px;gap:5px}.inspect{padding:10px}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="overline">Ink Studio / Delivered sync check</div>
      <h1>Relay Press</h1>
      <p>One contact. Two prints with the same scheduled cue.</p>
    </div>
    <div class="modes" role="group" aria-label="Compare deliveries">
      <button id="late" aria-pressed="true">Original print</button>
      <button id="aligned" aria-pressed="false">Aligned print</button>
    </div>
  </header>
  <div class="workspace">
    <div class="viewer">
      <div class="stage">
        <video id="late-video" preload="auto" playsinline aria-label="Original print with sound"></video>
        <video id="aligned-video" preload="auto" playsinline aria-label="Aligned print with sound" hidden></video>
      </div>
      <div class="transport">
        <button id="play">Play</button>
        <input id="seek" type="range" min="0" max="3" step="0.001" value="0" aria-label="Playhead">
        <output class="number" id="time">0.000 s</output>
        <button id="mute" aria-pressed="false">Mute</button>
      </div>
    </div>
    <aside class="inspect">
      <div id="status" class="status">
        <div class="overline">Measured offset</div>
        <output id="offset"></output>
        <p id="result"></p>
      </div>
      <h2>Contact crop from delivered frames</h2>
      <div class="evidence">
        <figure><img id="before" alt="Brass tip separated from the steel terminal"><figcaption id="before-label"></figcaption></figure>
        <figure><img id="after" alt="Brass tip closes onto the steel terminal"><figcaption id="after-label"></figcaption></figure>
      </div>
      <div class="jumps">
        <button id="audition">Play around contact</button>
        <button id="visible">Show contact frame</button>
      </div>
    </aside>
  </div>
  <section class="clock" aria-label="Measured timing">
    <header><h2>Timing around the contact</h2><p class="number">Take time</p></header>
    <div class="axis"><span></span><span><time>0.900 s</time><time>1.100 s</time><time>1.300 s</time></span></div>
    <div class="lane scheduled"><label>Scheduled cues</label><div class="rail"></div><time id="schedule-time"></time></div>
    <div class="lane picture"><label>Visible contact</label><div class="rail"></div><time id="picture-time"></time></div>
    <div class="lane audio"><label>Audible attack</label><div class="rail"></div><time id="audio-time"></time></div>
  </section>
</main>
<script>
  const results=/* RESULTS */ {};
  const media=/* MOVIES */ {};
  const crops=/* CROPS */ [];
  const element=id=>document.getElementById(id);
  const modes=['late','aligned'], videos=Object.fromEntries(modes.map(mode=>[mode,element(mode+'-video')]));
  for(const mode of modes){
    const bytes=Uint8Array.from(atob(media[mode]),value=>value.charCodeAt(0));
    videos[mode].src=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
  }
  for(const [i,id] of ['before','after'].entries()) element(id).src='data:image/png;base64,'+crops[i];
  const play=element('play'), seek=element('seek'), mute=element('mute');
  let mode='late', active=videos[mode], muted=false;
  const label=seconds=>seconds.toFixed(3)+' s';
  function displayTime(){
    seek.value=active.currentTime;
    element('time').value=label(active.currentTime);
    play.textContent=active.paused ? (active.ended ? 'Replay' : 'Play') : 'Pause';
  }
  function marker(kind,seconds){
    document.querySelector('.'+kind+' .rail').style.setProperty('--at',((seconds-.9)/.4*100)+'%');
    element((kind==='scheduled'?'schedule':kind)+'-time').textContent=label(seconds);
  }
  function show(){
    const {picture,audio,deltaMs,status,scheduled}=results[mode], aligned=status==='in-sync';
    element('status').classList.toggle('good',aligned);
    element('offset').value=(deltaMs>0?'+':'')+deltaMs.toFixed(1)+' ms';
    element('result').textContent=aligned?'Within the 25 ms tolerance':'Audio late · 25 ms tolerance';
    element('before-label').textContent='Frame '+(picture.frame-1)+' · gap';
    element('after-label').textContent='Frame '+picture.frame+' · contact';
    marker('scheduled',scheduled.frame/24);
    marker('picture',picture.seconds);
    marker('audio',audio.seconds);
    displayTime();
  }
  function start(){
    if(active.ended) active.currentTime=0;
    active.play().catch(displayTime);
  }
  play.addEventListener('click',()=>active.paused?start():active.pause());
  seek.addEventListener('input',()=>{active.currentTime=Number(seek.value);displayTime();});
  mute.addEventListener('click',()=>{
    muted=!muted;
    for(const video of Object.values(videos)) video.muted=muted;
    mute.textContent=muted?'Unmute':'Mute';
    mute.setAttribute('aria-pressed',String(muted));
  });
  element('audition').addEventListener('click',()=>{active.currentTime=.79;start();});
  element('visible').addEventListener('click',()=>{
    active.pause();
    active.currentTime=results[mode].picture.seconds+.001;
    displayTime();
  });
  for(const key of modes) {
    element(key).addEventListener('click',()=>{
      if(key===mode) return;
      const keep=active.currentTime, resume=!active.paused;
      active.pause();
      active.hidden=true;
      element(mode).setAttribute('aria-pressed','false');
      mode=key;
      active=videos[mode];
      active.currentTime=keep;
      active.hidden=false;
      element(mode).setAttribute('aria-pressed','true');
      if(resume) start();
      show();
    });
    for(const event of ['timeupdate','pause','playing','ended','seeked']) videos[key].addEventListener(event,displayTime);
  }
  show();
</script>
</body>
</html>
