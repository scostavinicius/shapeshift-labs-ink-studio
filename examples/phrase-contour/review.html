<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Wind · Ink Studio</title>
<style>
  :root{color-scheme:light;--ink:#182e28;--muted:#4c665c;--base:#edf3e9;--panel:#fafbf7;--line:#cad7cb;--accent:#1d6251}
  *{box-sizing:border-box}
  body{margin:0;background:var(--base);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
  main{max-width:1020px;margin:auto;padding:clamp(25px,4vw,50px) clamp(16px,5vw,54px)}
  .brand,.legend,#details{font:600 .74rem/1.5 ui-monospace,monospace;letter-spacing:.06em}
  .brand{color:var(--accent);text-transform:uppercase}
  h1{font:normal clamp(3.5rem,8vw,6.6rem)/.94 Georgia,serif;letter-spacing:-.06em;margin:.08em 0 .11em}
  h2{font-size:1rem;margin:0;font-weight:650}
  header p{margin:0 0 20px;max-width:63ch;color:var(--muted)}
  section{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:12px;padding:14px clamp(13px,3vw,23px)}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding-top:11px;padding-bottom:11px}
  .choices{display:flex;flex-wrap:wrap;gap:5px}
  button{font:630 .86rem system-ui,sans-serif;color:inherit;background:#e9f0e7;border:1px solid #c7d6ca;border-radius:8px;cursor:pointer;padding:8px 11px}
  button:hover:not([aria-pressed=true]){background:#d9e8db}
  button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  audio{height:37px;min-width:180px;flex:1}
  .heading{display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin-bottom:7px}
  .legend{display:flex;gap:15px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;vertical-align:.14em;width:9px;height:6px;margin-right:5px;background:#a1b2a5;border-radius:1px}
  .legend span:last-child::before{background:#2d806a}
  canvas{display:block;width:100%;height:210px}
  #details{color:var(--muted);margin:9px 0 0}
  @media(max-width:630px){audio{min-width:100%}.choices{gap:4px}button{padding:7px}.legend{gap:8px}}
</style>
<main>
  <header>
    <div class="brand">Ink Studio / Phrase contour borrowing</div>
    <h1>Paper Wind</h1>
    <p>A five-note played call shapes a seven-note answer. Compare the written and borrowed performances. The green notes keep the same key-ups and articulations.</p>
  </header>
  <section class="controls" aria-label="Listen to the phrase">
    <div class="choices" role="group" aria-label="Take selection">
      <button type="button" data-take="donor" aria-pressed="false">Played call</button>
      <button type="button" data-take="reference" aria-pressed="false">Written answer</button>
      <button type="button" data-take="borrowed" aria-pressed="true">Borrowed answer</button>
    </div>
    <audio controls preload="metadata" aria-label="Selected phrase"></audio>
  </section>
  <section aria-label="Destination note comparison">
    <div class="heading">
      <h2>Answer timing and breath</h2>
      <div class="legend"><span>Written</span><span>Borrowed</span></div>
    </div>
    <canvas id="contour" role="img" aria-label="Written and borrowed note starts, shared key-ups, and the fitted breath contour"></canvas>
    <p id="details"></p>
  </section>
</main>
<script>
const demo=/*INK_CONTOUR_DATA*/;
/*INK_CONTOUR_SCRIPT*/
</script>
</html>
