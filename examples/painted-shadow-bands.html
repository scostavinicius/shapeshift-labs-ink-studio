<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Marsh Gate · Shadow band paint</title>
<style>
  :root{color-scheme:dark;--ink:#121d24;--panel:#192831;--line:#3a5051;--paper:#ead9b9;--dim:#9eb3ac;--warm:#ebba81}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 system-ui,sans-serif}
  main{max-width:1080px;margin:auto;padding:clamp(16px,4vw,42px)}
  h1{font:clamp(34px,7vw,62px)/1 Georgia,serif;margin:0 0 10px;color:var(--warm)}
  p{margin:0 0 20px;color:var(--dim)}
  section{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:22px;align-items:start}
  canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair;background:#17252b;border:1px solid var(--line)}
  aside{background:var(--panel);border:1px solid var(--line);padding:15px;display:grid;gap:15px}
  fieldset{border:0;margin:0;padding:0;display:grid;gap:7px;min-width:0}
  legend{font-weight:650;margin-bottom:4px}
  .buttons{display:flex;gap:6px;flex-wrap:wrap}
  button{border:1px solid var(--line);padding:6px 10px;background:var(--ink);color:inherit;font:inherit;cursor:pointer}
  button[aria-pressed="true"]{border-color:var(--warm);color:var(--warm)}
  label.range{display:grid;grid-template-columns:1fr auto;gap:3px}
  input[type="range"]{grid-column:1/-1;width:100%;accent-color:var(--warm)}
  input[type="checkbox"]{accent-color:var(--warm)}
  output,#status{color:var(--dim);font-variant-numeric:tabular-nums}
  #status{font-size:13px;min-height:1.5rem}
  @media(max-width:680px){section{grid-template-columns:1fr}aside{grid-template-columns:repeat(2,minmax(0,1fr))}#status{grid-column:1/-1}}
</style>
<main>
  <h1>The Marsh Gate</h1>
  <p>Paint the stone to decide when each part enters the light. Drag across the relief or scrub the lantern.</p>
  <section aria-label="Painted shadow bands">
    <canvas id="view" width="238" height="222" aria-label="Paintable stone heron relief"></canvas>
    <aside>
      <fieldset>
        <legend>Brush</legend>
        <div class="buttons" id="modes">
          <button data-sign="1" aria-pressed="true">Later</button>
          <button data-sign="-1" aria-pressed="false">Earlier</button>
          <button data-sign="0" aria-pressed="false">Erase</button>
        </div>
        <label class="range" for="radius">Radius <output id="radius-value"></output>
          <input id="radius" type="range" min=".04" max=".36" step=".01" value=".14">
        </label>
        <label class="range" for="bias">Strength <output id="bias-value"></output>
          <input id="bias" type="range" min=".05" max=".75" step=".01" value=".32">
        </label>
      </fieldset>
      <fieldset>
        <legend>Lantern</legend>
        <label class="range" for="time">Time <output id="time-value"></output>
          <input id="time" type="range" min="0" max="4" step=".01" value=".88">
        </label>
        <div class="buttons"><button id="play" aria-pressed="false">Play</button></div>
        <label><input id="show" type="checkbox" checked> Show paint</label>
      </fieldset>
      <div class="buttons">
        <button id="undo">Undo</button><button id="reset">Reset</button>
        <button id="save">Export strokes</button>
      </div>
      <output id="status" role="status"></output>
    </aside>
  </section>
</main>
<script src="../dist/ink-studio.browser.js"></script>
<script src="./painted-shadow-bands.js"></script>
<script type="module" src="./painted-shadow-bands-workshop.mjs"></script>
</html>
