<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Latch · Shared focus track</title>
<style>
  :root{color-scheme:dark;--bg:#111818;--panel:#192323;--border:#31403b;--text:#e9e4d6;--muted:#a6b3a9;--amber:#f2c789}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 55% 0%,#202e2c 0%,var(--bg) 62%);
    color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
  main{max-width:960px;margin:0 auto;padding:34px 28px 42px}
  header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:18px}
  h1{font:500 clamp(37px,7vw,58px)/1 Georgia,serif;letter-spacing:-.05em;margin:4px 0 9px}
  p{margin:0;color:var(--muted)}
  .eyebrow{font:700 11px/1.3 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
  .switch,.transport,.beats{display:flex;gap:6px}
  .switch{padding:3px;background:#121a19;border:1px solid var(--border);border-radius:9px;flex:0 0 auto}
  button{font:inherit;color:var(--text);background:none;border:1px solid transparent;border-radius:6px;cursor:pointer}
  button:hover{background:#2b3733}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .switch button{padding:7px 13px;font-size:13px}
  .switch [aria-pressed=true]{background:#ead3ad;color:#252520}
  .viewer{overflow:hidden;background:var(--panel);border:1px solid var(--border);border-radius:13px}
  .stage{position:relative;background:#101617;aspect-ratio:16/9;overflow:hidden}
  video{position:absolute;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  .tag{position:absolute;left:15px;top:14px;pointer-events:none;border-radius:4px;background:#101918dc;padding:4px 8px;
    font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.03em;color:#f2d6a9}
  .transport{padding:10px 14px;align-items:center;border-top:1px solid var(--border);gap:10px}
  .transport button{padding:4px 8px;border-color:var(--border);min-width:64px}
  .transport input{width:100%;min-width:0;accent-color:var(--amber);cursor:pointer}
  output{flex-shrink:0;white-space:nowrap;color:var(--muted);font:12px ui-monospace,monospace}
  .beats{margin-top:12px;gap:10px}
  .beats button{flex:1;min-width:0;border:1px solid var(--border);text-align:left;padding:12px 13px;background:#192321}
  .beats button[aria-current=true]{background:#342f23;border-color:#9c7c50}
  .beats b,.beats small{display:block}
  .beats small{color:var(--muted);line-height:1.35;margin-top:3px}
  .beats time{font:600 11px ui-monospace,monospace;color:var(--amber)}
  footer{margin-top:14px;font-size:13px}
  @media(max-width:620px){main{padding:20px 14px 26px}header{align-items:flex-start;flex-direction:column;gap:12px}
    .beats{gap:5px}.beats button{padding:7px 5px}.beats small{display:none}.transport{gap:6px;padding:7px}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">Ink Studio / Shared focus track</div>
      <h1>Harbor Latch</h1>
      <p>One beat track directs the picture and the mix.</p>
    </div>
    <div class="switch" role="group" aria-label="Comparison">
      <button id="directed" aria-pressed="true">Directed</button>
      <button id="bypass" aria-pressed="false">Bypass</button>
    </div>
  </header>
  <div class="viewer">
    <div class="stage">
      <video id="directed-video" preload="auto" playsinline aria-label="Directed take"></video>
      <video id="bypass-video" preload="auto" playsinline aria-label="Bypassed take" hidden></video>
      <span class="tag" id="focus">Scene</span>
    </div>
    <div class="transport">
      <button id="play">Play</button>
      <input id="seek" type="range" min="0" max="6" step="0.01" value="0" aria-label="Playhead">
      <output id="time">0.00 / 6.00</output>
      <button id="sound" aria-pressed="false">Mute</button>
    </div>
  </div>
  <div class="beats" role="group" aria-label="Jump to focus beat">
    <button data-time="0.95" data-subject="hand"><time>0.50 s</time><b>Hand</b><small>Glove contrast and cloth</small></button>
    <button data-time="2.61" data-subject="latch"><time>2.13 s</time><b>Latch</b><small>Metal up, harbor down</small></button>
    <button data-time="4.18" data-subject="harbor"><time>3.50 s</time><b>Harbor</b><small>Beacon and water return</small></button>
  </div>
  <footer><p>Switch takes at the same playhead. Start just before the latch clicks to hear how the harbor bed changes.</p></footer>
</main>
<script>
  const cues=/* CUES */ [];
  const movies=/* MOVIES */ {};
  const byId=id=>document.getElementById(id);
  const modes=['directed','bypass'];
  const videos=Object.fromEntries(modes.map(mode=>[mode,byId(mode+'-video')]));
  const play=byId('play'), seek=byId('seek'), sound=byId('sound');
  const jumps=[...document.querySelectorAll('[data-time]')];
  const names={scene:'Scene',hand:'Hand',latch:'Latch',harbor:'Harbor'};
  for (const [mode,video] of Object.entries(videos)) {
    if (movies[mode]) {
      const bytes=Uint8Array.from(atob(movies[mode]),s=>s.charCodeAt(0));
      video.src=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
    } else video.src=mode+'.mp4';
  }
  let mode='directed', active=videos[mode], muted=false;
  function reflect() {
    const t=active.currentTime;
    seek.value=t;
    byId('time').value=t.toFixed(2)+' / 6.00';
    if (mode==='bypass') byId('focus').textContent='Track bypassed';
    let current=null;
    for (const cue of cues) if (t>=cue.start) current=cue;
    const subject=current?.subject ?? 'scene';
    if (mode==='directed')
      byId('focus').textContent=(current && t<current.end ? 'To ' : '')+names[subject];
    for (const button of jumps) button.setAttribute('aria-current',String(mode==='directed' && subject===button.dataset.subject));
    play.textContent=active.paused ? (active.ended ? 'Replay' : 'Play') : 'Pause';
  }
  function start() {
    if (active.ended) active.currentTime=0;
    active.play().catch(reflect);
  }
  play.addEventListener('click',()=>active.paused ? start() : active.pause());
  sound.addEventListener('click',()=>{
    muted=!muted;
    for (const video of Object.values(videos)) video.muted=muted;
    sound.setAttribute('aria-pressed',String(muted));
    sound.textContent=muted ? 'Unmute' : 'Mute';
  });
  seek.addEventListener('input',()=>{active.currentTime=Number(seek.value);reflect();});
  for (const button of jumps) button.addEventListener('click',()=>{
    active.currentTime=Number(button.dataset.time);reflect();start();
  });
  for (const key of modes) {
    byId(key).addEventListener('click',()=>{
      if (key===mode) return;
      const resume=!active.paused, t=active.currentTime;
      active.pause();
      active.hidden=true;
      byId(mode).setAttribute('aria-pressed','false');
      mode=key;
      active=videos[mode];
      active.currentTime=t;
      active.hidden=false;
      byId(mode).setAttribute('aria-pressed','true');
      if (resume) start();
      reflect();
    });
    for (const event of ['timeupdate','pause','playing','ended','seeked']) videos[key].addEventListener(event,reflect);
  }
  reflect();
</script>
</body>
</html>
