<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence palette · Ink Studio</title>
<style>
  :root { color-scheme: dark; --page: #151717; --card: #202324; --line: #3c4141; --text: #eef1ee; --muted: #b9c2bf; --accent: #b7e7d4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1160px; margin: auto; padding: 32px clamp(14px, 4vw, 46px) 52px; }
  header, .section-title { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header { margin-bottom: 20px; }
  h1 { margin: 3px 0 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: -.045em; line-height: 1.06; }
  h2 { margin: 0; font-size: 15px; }
  p { margin: 0; }
  .sub, .meta { color: var(--muted); }
  .meta { font: 12px/1.5 ui-monospace, monospace; }
  button, select { border: 1px solid var(--line); background: var(--card); border-radius: 6px; color: var(--text); font: inherit; padding: 7px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button[aria-pressed="true"] { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #172722; font-weight: 620; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
  select { margin-left: 4px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .shot { display: flex; align-items: center; min-width: 0; gap: 8px; padding: 5px; text-align: left; }
  .shot img { width: min(70px, 32%); border-radius: 3px; }
  img { display: block; image-rendering: pixelated; }
  .frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; background: #151b1d; }
  figcaption { display: flex; align-items: center; justify-content: space-between; gap: 7px; min-height: 42px; padding: 6px 11px; }
  .scrub { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; }
  .scrub input { flex: 1; accent-color: var(--accent); }
  section { margin-top: 22px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 6px; margin: 9px 0; }
  .swatches button { text-align: left; min-width: 0; padding: 4px; }
  .swatches span { display: block; }
  .chip { height: 29px; border-radius: 3px; border: 1px solid #ffffff33; }
  .swatch-label { margin: 4px 1px 0; font: 11px ui-monospace, monospace; white-space: nowrap; }
  .swatch-detail { min-height: 24px; }
  table { width: 100%; margin-top: 6px; border-collapse: collapse; }
  caption { text-align: left; color: var(--muted); margin: 3px 0 6px; }
  th, td { text-align: right; padding: 7px 5px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { main { padding-top: 20px; } .frames { grid-template-columns: 1fr; } .shot img { display: none; } .shot { padding: 7px; } }
</style>
<main>
  <header>
    <div><p class="meta">Ink Studio · Sequence palette</p><h1 id="title"></h1></div>
    <div class="controls"><label>Swatch budget <select id="budget"></select></label><button class="primary" id="download">Download palette policy</button></div>
  </header>
  <nav id="shots" class="shots" aria-label="Shots"></nav>
  <div class="frames">
    <figure><figcaption><strong>Source</strong><span class="meta" id="source-count"></span></figcaption><img id="source-frame" alt="Source frame"></figure>
    <figure><figcaption><strong>Shared palette</strong><span class="meta" id="allocated-count"></span></figcaption><img id="allocated-frame" alt="Frame remapped to the shared palette"></figure>
  </div>
  <label class="scrub" id="scrub" hidden><span>Sample</span><input type="range" id="frame" min="0" value="0"><span class="meta" id="time"></span></label>
  <section aria-labelledby="palette-title">
    <div class="section-title"><h2 id="palette-title">Sequence swatches</h2><span id="palette-stats" class="meta"></span></div>
    <div id="swatches" class="swatches" role="group" aria-label="Swatch details"></div>
    <p id="swatch-detail" class="sub swatch-detail" aria-live="polite"></p>
  </section>
  <section aria-labelledby="materials-title">
    <div class="section-title"><h2 id="materials-title">Material coverage</h2><label>Scope <select id="scope"><option value="all">Sequence</option><option value="frame">Current frame</option></select></label></div>
    <table><caption>Share of visible pixels and swatches before and after allocation.</caption><thead><tr><th scope="col">Material</th><th scope="col">Pixels</th><th scope="col">Source</th><th scope="col">Used</th><th scope="col" id="exclusive">Exclusive slots</th></tr></thead><tbody id="materials"></tbody></table>
  </section>
</main>
<script>
'use strict';
const data = /*SEQUENCE_DATA*/;
const byId = id => document.getElementById(id);
const select = byId('budget'), slider = byId('frame');
const materialName = name => name ?? 'Unattributed';
const share = value => {
  const percent = 100 * value;
  if (percent > 0 && percent < .001) return '<0.001%';
  return percent.toFixed(percent > 0 && percent < .1 ? 3 : 1) + '%';
};
let variant = data.variants.find(row => row.budget === data.budget), shot = 0, frame = 0;
let picked = variant.swatches.findIndex(item => item.pinned);
if (picked < 0) picked = 0;

byId('title').textContent = data.title;
for (const row of data.variants) select.add(new Option(row.budget, row.budget, false, row === variant));
select.disabled = data.variants.length === 1;
const shotButtons = data.source.map((item, index) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'shot';
  const image = document.createElement('img'); image.alt = '';
  const label = document.createElement('span'); label.textContent = item.label;
  button.append(image, label);
  button.addEventListener('click', () => { shot = index; frame = 0; update(); });
  byId('shots').append(button);
  return { button, image };
});

function renderMaterials() {
  const across = byId('scope').value === 'all';
  const rows = across ? variant.materials : variant.shots[shot].frames[frame].materials;
  byId('exclusive').hidden = !across;
  byId('materials').replaceChildren(...rows.map(row => {
    const tr = document.createElement('tr');
    const name = document.createElement('th'); name.scope = 'row'; name.textContent = materialName(row.name); tr.append(name);
    for (const value of [share(row.share), row.sourceSwatches, row.usedSwatches, ...(across ? [row.sourceExclusiveSwatches + ' → ' + row.exclusiveSwatches] : [])]) {
      const cell = document.createElement('td'); cell.textContent = value; tr.append(cell);
    }
    return tr;
  }));
}

function describeSwatch() {
  const swatch = variant.swatches[picked];
  const label = swatch.label ? swatch.label + ' · ' : '';
  const owners = swatch.materials.map(materialName);
  byId('swatch-detail').textContent = label + swatch.color + (swatch.pinned ? ' · Pinned' : '') + ' · ' +
    share(swatch.share) + ' of visible pixels' + (owners.length ? ' · ' + owners.join(', ') : '');
  Array.from(byId('swatches').children).forEach((button, i) => button.setAttribute('aria-pressed', String(i === picked)));
}

function renderSwatches() {
  byId('palette-stats').textContent = variant.palette.length + ' swatches · ' + variant.swatches.filter(item => item.pinned).length + ' pinned';
  byId('swatches').replaceChildren(...variant.swatches.map((swatch, index) => {
    const button = document.createElement('button'); button.type = 'button';
    button.setAttribute('aria-label', [swatch.label, swatch.color, swatch.pinned ? 'Pinned' : ''].filter(Boolean).join(' '));
    const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = swatch.color;
    const label = document.createElement('span'); label.className = 'swatch-label'; label.textContent = swatch.color + (swatch.pinned ? ' ◆' : '');
    button.append(chip, label);
    button.addEventListener('click', () => { picked = index; describeSwatch(); });
    return button;
  }));
  describeSwatch();
}

function update() {
  const current = variant.shots[shot].frames[frame], source = data.source[shot];
  byId('source-frame').src = source.frames[frame].image;
  byId('allocated-frame').src = current.image;
  byId('source-frame').alt = source.label + ' · source';
  byId('allocated-frame').alt = source.label + ' · shared palette';
  byId('source-count').textContent = current.sourceSwatches + ' swatches';
  byId('allocated-count').textContent = current.usedSwatches + ' of ' + variant.palette.length + ' used';
  slider.max = source.frames.length - 1; slider.value = frame;
  byId('scrub').hidden = source.frames.length < 2;
  byId('time').textContent = current.time.toFixed(2) + ' s';
  shotButtons.forEach(({ button, image }, index) => {
    button.setAttribute('aria-pressed', String(index === shot));
    image.src = variant.shots[index].frames[0].image;
  });
  renderMaterials();
}

select.addEventListener('change', () => {
  const previous = variant.palette[picked];
  variant = data.variants.find(row => row.budget === Number(select.value));
  picked = Math.max(0, variant.palette.indexOf(previous));
  renderSwatches(); update();
});
slider.addEventListener('input', () => { frame = Number(slider.value); update(); });
byId('scope').addEventListener('change', renderMaterials);
byId('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(variant.policy, null, 2) + '\n'], { type: 'application/json' }));
  const link = document.createElement('a'); link.href = url; link.download = 'palette-' + variant.budget + '-policy.json';
  link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
renderSwatches(); update();
</script>
</html>
