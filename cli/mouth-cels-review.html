<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouth cel review · Ink Studio</title>
<style>
  :root{color-scheme:dark;--bg:#101820;--panel:#19252d;--line:#344650;--text:#eee8db;--muted:#acbac0;--amber:#ffca83;--mint:#9ddcb4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 55% -45%,#42605d,var(--bg) 70%);color:var(--text);font:14px/1.42 system-ui,sans-serif}
  main{max-width:1110px;margin:auto;padding:24px 27px 40px}
  header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:15px}
  h1{font:500 clamp(36px,6vw,55px)/1 Georgia,serif;letter-spacing:-.045em;margin:4px 0 7px}
  h2{font-size:14px;margin:0}
  p{margin:0;color:var(--muted)}
  small,.mono,output{font:600 11px/1.4 ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .eyebrow{color:var(--amber);text-transform:uppercase;letter-spacing:.13em}
  .workspace{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
  .viewer,.inspector,.exposures{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .stage{height:clamp(200px,47vh,420px);display:grid;place-items:center;background:#111e25;position:relative;overflow:hidden}
  canvas{image-rendering:pixelated;display:block}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
  .transport{display:flex;align-items:center;gap:9px;padding:9px;border-top:1px solid var(--line)}
  .transport input{width:100%;min-width:0;accent-color:var(--amber)}
  button,select{font:inherit;border:1px solid var(--line);border-radius:6px;color:var(--text);background:#202f36;padding:5px 8px}
  button{cursor:pointer}
  button:hover,select:hover{background:#314349}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button:disabled{opacity:.43;cursor:default}
  .primary{background:#edcf9f;border-color:#edcf9f;color:#232522;padding:7px 11px;white-space:nowrap}
  .primary:hover{background:#ffe1ad}
  #time{white-space:nowrap;color:var(--muted)}
  .inspector{padding:15px;display:flex;flex-direction:column;gap:12px}
  .inspect-top{display:flex;align-items:baseline;justify-content:space-between}
  .inspect-top output{color:var(--muted)}
  .posecard{display:grid;grid-template-columns:137px 1fr;gap:13px;align-items:center;background:#142028;padding:10px;border:1px solid var(--line);border-radius:7px}
  .posecard canvas{width:100%;height:70px;object-fit:contain;background:repeating-conic-gradient(#22333c 0% 25%,#293c45 0% 50%) 50%/12px 12px;border-radius:4px}
  .posecard strong{font-size:17px;display:block}
  .posecard p{font-size:12px;margin-top:2px}
  .edit{display:flex;align-items:center;gap:8px}
  .edit select{flex:1;min-width:0}
  .edge{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .edge span{color:var(--muted);margin-right:4px}
  .state{color:var(--muted);font-size:12px}
  .state.approved{color:var(--mint)}
  .exposures{margin-top:12px;padding:12px 12px 10px}
  .exposures header{margin:0 0 8px}
  .holds{display:flex;gap:4px;overflow:auto;padding:3px 3px 7px;scrollbar-color:#5a6e74 #1b2830}
  .holds button{flex-shrink:0;min-width:80px;text-align:left;padding:5px 7px}
  .holds button[aria-pressed=true]{border-color:var(--amber);background:#3c392c}
  .holds button.approved b::after{content:' ✓';color:var(--mint)}
  .holds b,.holds span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .holds span{color:var(--muted);font-size:10px}
  @media(max-width:780px){main{padding:15px 13px 25px}.workspace{grid-template-columns:1fr}.stage{height:clamp(190px,47vw,330px)}}
  @media(max-width:470px){header{align-items:start;flex-wrap:wrap}.posecard{grid-template-columns:105px 1fr}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow mono">Ink Studio / Mouth cel review</div>
      <h1 id="title">Mouth cel review</h1>
      <p id="summary"></p>
    </div>
    <button class="primary" id="save">Download edited holds</button>
  </header>
  <div class="workspace">
    <div class="viewer">
      <div class="stage"><canvas id="face" aria-label="Native character mouth preview"></canvas></div>
      <div class="transport">
        <button id="play">Play</button>
        <input id="seek" aria-label="Read playhead" type="range" min="0" step="0.001" value="0">
        <output id="time">0.000 s</output>
        <button id="mute" aria-pressed="false">Mute</button>
      </div>
    </div>
    <section class="inspector" aria-label="Edit selected hold">
      <div class="inspect-top"><h2>Selected hold</h2><output id="range"></output></div>
      <div class="posecard">
        <canvas id="cel" aria-label="Selected mouth cel at native resolution"></canvas>
        <div><strong id="phonemes"></strong><p id="evidence"></p></div>
      </div>
      <label class="edit" for="pose">Cel <select id="pose"></select></label>
      <div class="edge">
        <span>Start frame</span>
        <button id="earlier" aria-label="Move hold start one frame earlier">−1</button>
        <button id="later" aria-label="Move hold start one frame later">+1</button>
      </div>
      <button id="approve">Approve hold</button>
      <output class="state" id="approval" aria-live="polite"></output>
    </section>
  </div>
  <section class="exposures" aria-label="Exposure sheet">
    <header><h2>Exposure sheet</h2><p class="mono" id="progress"></p></header>
    <div class="holds" role="group" aria-label="Choose a mouth hold" id="holds"></div>
  </section>
  <audio id="voice" preload="auto"></audio>
</main>
<script>
  const sheet=/* SHEET */ {};
  const pictures=/* PICTURES */ {};
  const wave=/* VOICE */ "";
  const byId=id=>document.getElementById(id);
  const fps=sheet.fps.numerator/sheet.fps.denominator, {grid,origin,size,poses}=sheet.rig;
  const player=byId('voice'), title=byId('title'), seek=byId('seek');
  const face=byId('face'), cel=byId('cel'), ctx=face.getContext('2d'), detail=cel.getContext('2d');
  const pose=byId('pose'), holds=sheet.holds, phone=new Map(sheet.phones.map(row=>[row.id,row]));
  [face.width,face.height]=grid;
  [cel.width,cel.height]=size;
  player.src=URL.createObjectURL(new Blob([Uint8Array.from(atob(wave),s=>s.charCodeAt(0))],{type:'audio/wav'}));
  seek.max=sheet.audio.frames/sheet.audio.sampleRate;
  title.textContent=sheet.id.split(/[-_]+/).filter(Boolean).map(word=>word[0].toUpperCase()+word.slice(1)).join(' ');
  document.title=title.textContent+' · Mouth cel review';
  const spoken=sheet.phones.filter(row=>row.symbol), omitted=spoken.filter(row=>!row.exposed);
  const coverage=omitted.length?' · '+omitted.length+' below the frame grid':'';
  byId('summary').textContent=grid.join(' × ')+' native pixels · '+Number(fps.toFixed(3))+' fps · '+spoken.length+' aligned phones'+coverage;
  if(omitted.length)byId('summary').title='Unexposed phones: '+omitted.map(row=>'/'+row.symbol+'/').join(' ');
  const picture=data=>{
    const image=new Image();
    image.src='data:image/png;base64,'+data;
    return image;
  };
  const portrait=picture(pictures.face), bank=Object.fromEntries(poses.map(key=>[key,picture(pictures.cels[key])]));
  for(const key of poses)pose.add(new Option(key,key));
  let selected=0, shown=-1, running=false;
  function draw(){
    if(!portrait.complete || !portrait.naturalWidth)return;
    const image=bank[holds[selected].pose];
    ctx.clearRect(0,0,...grid);
    ctx.drawImage(portrait,0,0);
    if(!image.complete || !image.naturalWidth)return;
    ctx.drawImage(image,...origin);
    detail.clearRect(0,0,...size);
    detail.drawImage(image,0,0);
  }
  function locate(frame){
    let low=0,high=holds.length-1;
    while(low<high){
      const mid=(low+high)>>>1;
      if(holds[mid].to<=frame)low=mid+1;
      else high=mid;
    }
    return low;
  }
  const tiles=holds.map((row,i)=>{
    const button=document.createElement('button'), name=document.createElement('b'), span=document.createElement('span');
    button.append(name,span);
    button.addEventListener('click',()=>select(i,true));
    byId('holds').append(button);
    return {button,name,span};
  });
  function tile(i){
    const row=holds[i], {button,name,span}=tiles[i];
    button.setAttribute('aria-pressed',String(i===selected));
    button.classList.toggle('approved',row.approval==='approved');
    name.textContent=row.pose;
    span.textContent='Frames '+row.from+'–'+(row.to-1);
    button.style.width=Math.min(225,74+Math.max(1,row.to-row.from)*8)+'px';
  }
  function refresh(){
    const row=holds[selected], related=row.phones.map(id=>phone.get(id)).filter(Boolean), prior=holds[selected-1];
    if(shown>=0)tile(shown);
    tile(selected);
    shown=selected;
    pose.value=row.pose;
    byId('range').value='Frames '+row.from+'–'+(row.to-1);
    byId('phonemes').textContent=related.length?related.map(n=>'/'+n.symbol+'/').join(' '):'Rest';
    byId('evidence').textContent=related.some(n=>n.emphasis)?'Emphasized syllable':
      related.length?'Waveform-aligned phones':'No exposed phone';
    byId('approve').textContent=row.approval==='approved'?'Reopen hold':'Approve hold';
    byId('approval').value=row.approval==='approved'?'Approved':'Proposed';
    byId('approval').classList.toggle('approved',row.approval==='approved');
    byId('earlier').disabled=!prior || prior.to-prior.from<2;
    byId('later').disabled=!prior || row.to-row.from<2;
    byId('progress').textContent=holds.filter(x=>x.approval==='approved').length+' of '+holds.length+' approved';
    draw();
  }
  function select(i,seekFrame=false){
    selected=i;
    if(seekFrame){
      player.pause();
      player.currentTime=(holds[i].from+.05)/fps;
    }
    refresh();
  }
  function track(){
    const t=player.currentTime;
    seek.value=t;
    byId('time').value=t.toFixed(3)+' s';
    byId('play').textContent=player.paused?(player.ended?'Replay':'Play'):'Pause';
    const i=locate(Math.min(sheet.frames-1,Math.floor(t*fps+1e-8)));
    if(i!==selected)select(i);
  }
  function tick(){
    if(!running)return;
    track();
    requestAnimationFrame(tick);
  }
  function shift(delta){
    const row=holds[selected], prior=holds[selected-1];
    if(!prior)return;
    const edge=row.from+delta;
    if(edge<=prior.from || edge>=row.to)return;
    prior.to=row.from=edge;
    prior.approval=row.approval='proposed';
    tile(selected-1);
    select(selected,true);
  }
  byId('earlier').addEventListener('click',()=>shift(-1));
  byId('later').addEventListener('click',()=>shift(1));
  byId('approve').addEventListener('click',()=>{
    player.pause();
    holds[selected].approval=holds[selected].approval==='approved'?'proposed':'approved';
    refresh();
  });
  pose.addEventListener('change',()=>{
    player.pause();
    holds[selected].pose=pose.value;
    holds[selected].approval='proposed';
    refresh();
  });
  byId('play').addEventListener('click',()=>{
    if(!player.paused){player.pause();return;}
    if(player.ended)player.currentTime=0;
    player.play().catch(track);
  });
  byId('mute').addEventListener('click',()=>{
    player.muted=!player.muted;
    byId('mute').textContent=player.muted?'Unmute':'Mute';
    byId('mute').setAttribute('aria-pressed',String(player.muted));
  });
  seek.addEventListener('input',()=>{player.currentTime=Number(seek.value);track();});
  player.addEventListener('playing',()=>{if(!running){running=true;tick();}});
  for(const event of ['pause','ended'])player.addEventListener(event,()=>{running=false;track();});
  player.addEventListener('seeked',track);
  byId('save').addEventListener('click',()=>{
    const a=document.createElement('a'), url=URL.createObjectURL(new Blob([JSON.stringify(sheet,null,2)+'\n'],{type:'application/json'}));
    a.href=url;
    a.download='mouth-holds.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  for(let i=0;i<holds.length;i++)tile(i);
  refresh();
  Promise.all([portrait,...Object.values(bank)].map(img=>img.decode())).then(draw);
</script>
</body>
</html>
